[package]
name = "nebula"
version = "0.1.0"
edition = "2024"
description = "GPU cluster control plane: topology-aware gang scheduling, fair share, backfill, preemption, node agents, simulator"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
